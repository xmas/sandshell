<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sandshell">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Sandshell</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <aside id="list-pane" aria-label="Sessions">
    <header class="bar">
      <div class="bar-title">
        <span class="mark" aria-hidden="true"></span>
        <span id="host">Sandshell</span>
      </div>
      <span id="conn" class="conn" title="Connecting…" aria-live="polite"></span>
    </header>
    <ul id="sessions" class="sessions"></ul>
    <p id="empty" class="empty" hidden>
      No chats are shared yet. On the Mac, turn on Remote Control
      <span class="inline-icon" aria-hidden="true">📡</span> in a chat's title strip.
    </p>
  </aside>

  <div id="placeholder" class="placeholder">Pick a chat to follow it here.</div>

  <main id="chat-pane" aria-label="Chat" hidden>
    <header class="bar">
      <button id="back" class="icon-button" aria-label="All chats">‹</button>
      <div class="bar-title stack">
        <span id="chat-title">Chat</span>
        <span id="chat-sub" class="sub"></span>
      </div>
      <select id="mode" aria-label="Mode" hidden></select>
    </header>
    <div id="transcript" class="transcript" aria-live="polite"></div>
    <div id="cards"></div>
    <form id="composer" class="composer" autocomplete="off">
      <div id="attachments" class="attachments" hidden></div>
      <div class="composer-row">
        <label class="icon-button attach" aria-label="Attach images" title="Attach images">
          <input id="file" type="file" accept="image/*" multiple hidden>
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M16.5 6.5 8.4 14.6a2 2 0 1 0 2.8 2.8l8.1-8.1a4 4 0 1 0-5.7-5.7l-8.1 8.1a6 6 0 1 0 8.5 8.5l6.4-6.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </label>
        <textarea id="input" rows="1" placeholder="Message" enterkeyhint="send"></textarea>
        <button id="send" class="send" type="submit" aria-label="Send">
          <svg class="i-send" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <svg class="i-stop" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3" fill="currentColor"/></svg>
        </button>
      </div>
      <div id="status" class="status"></div>
    </form>
  </main>

  <main id="check-pane" aria-label="Remote check" hidden>
    <header class="bar">
      <button id="check-back" class="icon-button" aria-label="All chats">‹</button>
      <div class="bar-title"><span>Remote check</span></div>
      <button id="check-run" class="pill">Run again</button>
    </header>
    <ol id="check-results" class="check-results"></ol>
  </main>
</div>
<script src="/app.js"></script>
</body>
</html>
