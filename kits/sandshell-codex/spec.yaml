# syntax=docker/sandbox-kit:3
# Sandshell's native Codex chats: the Codex ACP adapter with its own Node
# runtime, built into an overlay at /opt/sandshell (the Codex workload ships
# no Node). The adapter runs the codex it depends on, not the image's: it
# talks to `codex app-server`, whose protocol moves with codex releases.
schemaVersion: "3"
kind: mixin
displayName: Sandshell chats for Codex
description: >-
  The Codex ACP adapter Sandshell's native chats run, with its Node runtime.
sourceUrl: https://github.com/xmas/sandshell-kits
licenses: [Apache-2.0]

args:
  version:
    default: "2.2.2"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    description: codex-acp release to install
    buildArg: ACP_VERSION

provides: ["sandshell-codex@${{ kit.args.version }}"]
requires: ["codex"]

dockerfile: ./Dockerfile

capabilities:
  - type: com.docker.sandbox/acp@1
    optional: true
    description: Drive Codex sessions over the Agent Client Protocol (Sandshell's chats)
    config:
      agent: codex
      command: [/opt/sandshell/bin/sandshell-codex-acp]
