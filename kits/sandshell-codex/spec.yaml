schemaVersion: "2"
kind: mixin
name: sandshell-codex
displayName: Sandshell chats for Codex
description: >-
  Preinstalls the ACP adapter Sandshell's native Codex chats run in this
  sandbox (@agentclientprotocol/codex-acp), and gives Codex the sign-in file
  `sbx run codex` writes, so chats sign in through sbx's credential proxy too.
requires:
  agent: codex
permissions:
  network:
    allow:
      - registry.npmjs.org
setup:
  install:
    - command: >-
        mkdir -p /home/agent/.sandshell/acp &&
        npm install --silent --no-audit --no-fund
        --prefix /home/agent/.sandshell/acp/codex-acp-2.2.2 @agentclientprotocol/codex-acp@2.2.2
      user: "1000"
      description: Install the Codex ACP adapter where Sandshell looks for it
  startup:
    - command:
        - sh
        - -c
        - >-
          H="${CODEX_HOME:-$HOME/.codex}";
          if [ ! -f "$H/auth.json" ] && [ -n "$SBX_CRED_OPENAI_MODE" ]; then
          mkdir -p "$H" && printf '%s' '{"OPENAI_API_KEY":"proxy-managed"}' > "$H/auth.json"; fi
      user: "1000"
      description: The placeholder sign-in sbx's proxy fills in (what sbx run codex writes)
